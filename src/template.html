<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>개인정보</title>
<link rel="stylesheet" href="template.css">
</head>
<body>
<main>
 <div class="top">
  <p class="brand">개인정보</p>
  <span id="updatedAt"></span>
  <div class="actions"><button id="saveBtn" type="button" class="primary">저장</button></div>
 </div>
 <div id="saveStatus" role="status" aria-live="polite" hidden></div>
 <div class="tab-bar">
 <div role="tablist" aria-label="메뉴">
  <button role="tab" id="tab-passwords" aria-controls="panel-passwords" data-tab="passwords">비밀번호</button>
  <button role="tab" id="tab-profile" aria-controls="panel-profile" data-tab="profile">개인정보</button>
  <button role="tab" id="tab-history" aria-controls="panel-history" data-tab="history">이력</button>
 </div>
 <div class="segmented" aria-label="비밀번호 구분">
  <button type="button" data-view="self" aria-pressed="true">본인 <span class="count"></span></button>
  <button type="button" data-view="family" aria-pressed="false">가족 <span class="count"></span></button>
 </div>
 </div>
 <div role="tabpanel" id="panel-profile" aria-labelledby="tab-profile">
  <section class="section" data-table="expenses"></section>
  <section class="section" data-table="identity"></section>
  <section class="section" data-table="family"></section>
 </div>
 <div role="tabpanel" id="panel-history" aria-labelledby="tab-history">
  <section class="section" data-table="history"></section>
 </div>
 <div role="tabpanel" id="panel-passwords" aria-labelledby="tab-passwords">
  <input id="pwSearch" type="search" aria-label="검색" placeholder="분류·사이트·링크·비고1~3 검색 (공백으로 여러 단어)" autocomplete="off">
  <section class="section" data-table="passwordsSelf" aria-label="본인 비밀번호"></section>
  <section class="section" data-table="passwordsFamily" aria-label="가족 비밀번호"></section>
 </div>
</main>
<script id="vault-pure" src="pure.js"></script>
<script src="app.js"></script>
</body>
</html>
