<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>개인정보</title>
<link rel="stylesheet" href="template.css">
</head>
<body>
<main>
 <header class="app-header">
 <div class="top">
  <div class="segmented" role="group" aria-label="전체 구분">
   <button type="button" data-view="self" aria-pressed="true">본인 <span class="count"></span></button>
   <button type="button" data-view="family" aria-pressed="false">가족 <span class="count"></span></button>
   <button type="button" data-view="other" aria-pressed="false">기타 <span class="count"></span></button>
  </div>
  <div class="save-meta">
   <span id="updatedAt"></span>
   <span id="saveStatus" role="status" aria-live="polite" hidden></span>
  </div>
  <div class="actions"><button id="saveBtn" type="button" class="primary">저장</button></div>
 </div>
 <div class="tab-bar">
 <div role="tablist" aria-label="메뉴">
  <button role="tab" id="tab-passwords" aria-controls="panel-passwords" data-tab="passwords">비밀번호</button>
  <button role="tab" id="tab-diary" aria-controls="panel-diary" data-tab="diary">일기</button>
  <button role="tab" id="tab-history" aria-controls="panel-history" data-tab="history">이력</button>
 </div>
 </div>
 </header>
 <div role="tabpanel" id="panel-diary" aria-labelledby="tab-diary">
  <section class="section" aria-label="일기">
   <input id="diarySearch" class="list-search" type="search" aria-label="일기 검색" placeholder="제목·이름·내용 검색 (공백으로 여러 단어)" autocomplete="off">
   <div data-table="diary"></div>
  </section>
 </div>
 <div role="tabpanel" id="panel-history" aria-labelledby="tab-history">
  <section class="section" aria-label="이력">
   <input id="historySearch" class="list-search" type="search" aria-label="이력 검색" placeholder="날짜·내용·이름·비고·거주지 검색 (공백으로 여러 단어)" autocomplete="off">
   <div data-table="history"></div>
  </section>
 </div>
 <div role="tabpanel" id="panel-passwords" aria-labelledby="tab-passwords">
  <section class="section" aria-label="비밀번호 목록">
   <input id="pwSearch" class="list-search" type="search" aria-label="검색" placeholder="분류·사이트·링크·비고1~3 검색 (공백으로 여러 단어)" autocomplete="off">
   <div data-table="passwordsSelf" aria-label="본인 비밀번호"></div>
   <div data-table="passwordsFamily" aria-label="가족 비밀번호"></div>
   <div data-table="passwordsOther" aria-label="기타 비밀번호"></div>
  </section>
 </div>
</main>
<script id="vault-pure" src="pure.js"></script>
<script src="app.js"></script>
</body>
</html>
