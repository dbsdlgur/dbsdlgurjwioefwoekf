*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f5f5f7;color:#1d1d1f;font:17px/1.47 'SF Pro Text',system-ui,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.022em;word-break:keep-all;-webkit-font-smoothing:antialiased}#lockPanel{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:80px 24px 48px;text-align:center}.lock{width:min(100%,400px)}.mark{display:block;width:56px;height:56px;margin:0 auto 40px}h2{font-family:'SF Pro Display',system-ui,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;font-weight:600}h2{font-size:21px;line-height:1.19;margin:0 0 8px}p{margin:0;color:#6e6e73}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}label{display:block;font-size:14px;color:#6e6e73;margin-top:28px;text-align:left}input{display:block;width:100%;height:44px;padding:0 20px;margin:8px 0 16px;font:inherit;color:inherit;border:1px solid #d2d2d7;border-radius:999px;background:#fff}#password{margin:0 0 12px;text-align:center}#password::placeholder{color:#6e6e73}input:focus{outline:2px solid #0071e3;outline-offset:1px;border-color:transparent}button{min-height:44px;padding:0 22px;font:inherit;border:1px solid #d2d2d7;background:#fff;color:#0066cc;border-radius:999px;cursor:pointer;transition:transform .1s}button:active:not(:disabled){transform:scale(.95)}button:focus-visible{outline:2px solid #0071e3;outline-offset:1px}button.primary{background:#0066cc;border-color:#0066cc;color:#fff}button:disabled{opacity:.45;cursor:wait}.wide{width:100%}.small{font-size:13px}.row{display:flex;justify-content:flex-end;gap:8px}#viewer{display:block;border:0;width:100%;height:100dvh;min-height:0}dialog{width:min(92vw,480px);padding:32px;border:1px solid #e0e0e0;border-radius:18px}dialog::backdrop{background:rgba(0,0,0,.48);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}#unlockStatus{min-height:20px;color:#c4291c;margin-top:12px;font-size:14px}@media(max-width:419px){#lockPanel{padding:48px 20px 32px}}
</style></head><body><section id="lockPanel"><div class="lock"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1d1d1f"/><path d="M22 28v-8a10 10 0 0 1 20 0v8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><rect x="16" y="28" width="32" height="24" rx="6" fill="#fff"/><circle cx="32" cy="40" r="3.5" fill="#1d1d1f"/></svg><form id="unlockForm" aria-label="개인정보 잠금 해제"><label for="password" class="sr">비밀번호</label><input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required><button id="unlock" class="primary wide">열기</button><div id="unlockStatus" role="status" aria-live="polite"></div></form></div></section><section id="workspace" hidden><iframe id="viewer" title="개인정보 관리 화면"></iframe></section><dialog id="githubAuth"><form method="dialog"><h2>GitHub 저장 연결</h2><p class="small">저장할 때 <b id="repoName"></b> 저장소의 Contents 읽기·쓰기 권한이 있는 토큰이 필요합니다. 입력한 토큰은 비밀번호로 암호화해 파일에 보관합니다. 비밀번호를 아는 사람은 저장소를 수정할 수 있습니다.</p><label for="githubToken">GitHub 토큰</label><input id="githubToken" type="password" autocomplete="off"><div class="row"><button value="cancel">취소</button><button value="connect" class="primary">연결</button></div></form></dialog><script>function bytes64(bytes){let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s)}
function unbase64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function passwordKey(password,salt,iterations=600000){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:unbase64(salt),iterations},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptHTML(html,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(html));return {version:1,kdf:'PBKDF2-SHA256',iterations:600000,salt,iv:bytes64(iv),data:bytes64(new Uint8Array(data))}}
async function encryptToken(token,key){const iv=crypto.getRandomValues(new Uint8Array(12));const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(token));return {iv:bytes64(iv),data:bytes64(new Uint8Array(data))}}
async function decryptToken(value,key){const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:unbase64(value.iv)},key,unbase64(value.data));return new TextDecoder().decode(data)}
async function decryptHTML(payload,key){if(payload.version!==1||payload.kdf!=='PBKDF2-SHA256'||payload.iterations!==600000)throw Error('지원하지 않는 파일 형식입니다.');const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:unbase64(payload.iv)},key,unbase64(payload.data));return new TextDecoder().decode(data)}

(()=>{
 const REPO='dbsdlgur/dbsdlgurjwioefwoekf',BRANCH='master',DATA_PATH='data.enc.json',SRC_DIR='src/';
 const $=id=>document.getElementById(id),frame=$('viewer'),BASE='https://api.github.com/repos/'+REPO+'/contents/';
 let payload=null,key=null,token='',dirty=false,busy=false,revision=0,rendering=false,notice='',noticeError=false,overwrite=false;
 const CONFLICT='다른 곳에서 수정된 내용이 있습니다. 저장을 한 번 더 누르면 지금 화면 값으로 덮어씁니다.';
 $('repoName').textContent=REPO;
 const doc=()=>frame.contentDocument;
 function show(text,error=false){notice=text;noticeError=error;const el=doc()?.getElementById('saveStatus');if(el){const result=error?'error':text.startsWith('저장 완료')?'success':'';el.dataset.result=result;el.textContent=result==='error'?'실패':result==='success'?'성공':'';el.title=text;el.setAttribute('aria-label',result==='error'?'저장 실패: '+text:result==='success'?text:'');el.hidden=!result}}
 function changed(){if(rendering)return;dirty=true;revision++;if(!busy)show('')}
 function inner(){const api=frame.contentWindow?.vaultApi;if(!api)throw Error('화면을 불러오는 중입니다. 잠시 후 다시 시도하세요.');return api}
 function saveBusy(value){const button=doc()?.getElementById('saveBtn');if(button){button.disabled=value;button.textContent=value?'저장 중…':'저장'}}
 function bindViewer(){doc().getElementById('saveBtn')?.addEventListener('click',()=>save());saveBusy(busy);show(notice,noticeError)}
 function view(html,state){frame.onload=()=>{rendering=true;try{inner().load(state)}finally{rendering=false}dirty=false;revision++;bindViewer()};frame.srcdoc=html;$('lockPanel').hidden=true;$('workspace').hidden=false}
 function askToken(){const dialog=$('githubAuth');$('githubToken').value='';dialog.showModal();return new Promise(resolve=>dialog.addEventListener('close',()=>{const value=$('githubToken').value.trim();$('githubToken').value='';resolve(dialog.returnValue==='connect'&&value?value:'')},{once:true}))}
 async function credentials(){if(token)return;const value=await askToken();if(!value)throw Error('GitHub 연결을 취소했습니다.');token=value}
 async function request(path,options={}){const r=await fetch(BASE+path+(options.method?'':'?ref='+BRANCH+'&t='+Date.now()),{...options,headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(token?{Authorization:'Bearer '+token}:{}),...options.headers},cache:'no-store',credentials:'omit'});if(!r.ok){if(r.status===401){token='';throw Error('GitHub 토큰을 다시 입력해 주세요.')}if(r.status===409||r.status===422){overwrite=true;throw Error(CONFLICT)}throw Error(r.status===403?'저장소의 Contents 쓰기 권한과 GitHub 요청 한도를 확인하세요.':'GitHub 요청 실패 ('+r.status+')')}return r}
 async function latestData(){const meta=await(await request(DATA_PATH)).json();if(meta.encoding!=='base64'||!meta.content)throw Error('데이터 파일을 읽지 못했습니다.');return {sha:meta.sha,payload:JSON.parse(new TextDecoder().decode(unbase64(meta.content.replace(/\s/g,''))))}}
 async function readSource(name){return(await request(SRC_DIR+name,{headers:{Accept:'application/vnd.github.raw+json'}})).text()}
 // 화면은 src/template.html에 link·script로 연결된 css·js를 그 자리에 끼워 한 HTML로 만든다. Pages가 아니라 API로 읽어 push 즉시 반영된다. template.html은 데이터와 동시에, css·js는 토큰을 푼 뒤 받는다.
 async function readTemplate(page){const names=[...new Set([...page.matchAll(/(?:href|src)="([\w.-]+\.(?:css|js))"/g)].map(m=>m[1]))],files=Object.fromEntries(await Promise.all(names.map(async n=>[n,await readSource(n)])));return page.replace(/<link rel="stylesheet" href="([\w.-]+\.css)">/g,(_,n)=>'<style>'+files[n]+'</style>').replace(/<script((?: [\w-]+="[^"]*")*) src="([\w.-]+\.js)"><\/script>/g,(_,attrs,n)=>'<script'+attrs+'>'+files[n]+'<\/script>')}
 function parseState(text){const state=JSON.parse(text);if(!state||state.schema!==1)throw Error('지원하지 않는 데이터 형식입니다.');return state}
 async function run(fn){if(busy)return;busy=true;saveBusy(true);try{await fn()}catch(e){show(e.message,true)}finally{busy=false;saveBusy(false)}}
 async function save(){return run(async()=>{if(!key)throw Error('비밀번호로 잠금을 먼저 해제하세요.');await credentials();show('GitHub 최신 데이터 확인 중…');const current=await latestData();if(!overwrite&&JSON.stringify(current.payload)!==JSON.stringify(payload)){overwrite=true;throw Error(CONFLICT)}const snapshot={...inner().serialize(),schema:1,updatedAt:new Date().toISOString()},atRevision=revision;show('변경값을 암호화해 저장 중…');const next=await encryptHTML(JSON.stringify(snapshot),key,payload.salt);next.githubToken=await encryptToken(token,key);await(await request(DATA_PATH,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Update encrypted vault data',branch:BRANCH,sha:current.sha,content:bytes64(new TextEncoder().encode(JSON.stringify(next)))})})).json();payload=next;overwrite=false;dirty=revision!==atRevision;frame.contentWindow?.vaultApi?.saved?.(snapshot.updatedAt);show(dirty?'저장 완료 · 저장 중 입력한 값은 한 번 더 저장하세요.':'저장 완료 · 다른 기기에서도 최신 값으로 열립니다.')})}
 $('unlockForm').onsubmit=async e=>{e.preventDefault();const button=$('unlock');button.disabled=true;$('unlockStatus').textContent='최신 데이터를 불러오고 있습니다…';try{const pageRequest=readSource('template.html');pageRequest.catch(()=>{});const current=await latestData();const candidate=await passwordKey($('password').value,current.payload.salt,current.payload.iterations);const state=parseState(await decryptHTML(current.payload,candidate));const savedToken=current.payload.githubToken?await decryptToken(current.payload.githubToken,candidate):'';token=savedToken;$('unlockStatus').textContent='화면을 불러오고 있습니다…';const page=await pageRequest,html=await readTemplate(page).catch(e=>{if(!savedToken||token)throw e;return readTemplate(page)});payload=current.payload;key=candidate;$('password').value='';view(html,state);show('')}catch(error){key=null;$('password').value='';$('unlockStatus').textContent=error.name==='OperationError'?'비밀번호가 맞지 않거나 파일이 손상되었습니다.':(error.message||'데이터를 불러오지 못했습니다.')}finally{button.disabled=false}};
 window.vaultHost={save,changed};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
})();
</script></body></html>
